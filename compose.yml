services:
  web:
    image: "bretfisher/jekyll-serve:stable-20240615-2119a31"
    ports:
      - "4000:4000"
    volumes:
      - .:/site
  build:
    image: "bretfisher/jekyll:stable-20240615-2119a31"
    entrypoint: ["sh", "-c"]
    command: ["bundle install && JEKYLL_ENV=production jekyll build"]
    volumes:
      - .:/site
